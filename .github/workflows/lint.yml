name: Plugin syntax checks

on:
  pull_request:
    branches: [main, fix/calendar-form-sync-performance, fix/mobile-calendar-modal-layout]
  push:
    branches: [main, feature/booking-approval-30m-workflow, feature/booking-management-dashboard, fix/mobile-calendar-modal-layout]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/js/datepicker-init.js
          node --check assets/js/persian-calendar-standalone.js
          node --check assets/js/calendar-display-widget.js
          node --check assets/js/availability-search-widget.js
